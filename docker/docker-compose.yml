services:
  openlaunch:
    container_name: openlaunch
    image: openlaunch:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server-side secrets and runtime overrides only.
      # Public configuration lives in config/public.ts.

      # IPFS Upload (choose Pinata or Filebase)
      - PINATA_API_KEY=${PINATA_API_KEY}
      - PINATA_SECRET_KEY=${PINATA_SECRET_KEY}
      - FILEBASE_API_KEY=${FILEBASE_API_KEY}

      # Solana RPC (optional override)
      - RPC_URL=${RPC_URL}

      # Database
      - DATA_DIR=${DATA_DIR:-./data}
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}

      # Cron
      - ENABLE_CRON=${ENABLE_CRON:-true}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/init"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
